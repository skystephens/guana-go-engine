services:
  # Frontend - Vite React App
  - type: web
    name: guana-go-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_MAPBOX_API_KEY
        value: pk.eyJ1IjoiZ3VhbmFnbyIsImEiOiJjbTdkMzZ4aDUwM2ZuMnJzaDAxN3ZrNW9oIn0.example
      - key: VITE_AIRTABLE_API_KEY
        value: pat...example

  # Backend - Node.js Express Server
  - type: web
    name: guana-go-backend
    runtime: node
    plan: free
    root: guanago-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: AIRTABLE_API_KEY
        value: pat...example
      - key: AIRTABLE_BASE_ID
        value: app...example
      - key: NODE_ENV
        value: production
