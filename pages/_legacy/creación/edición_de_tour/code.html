<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Creación/Edición Tour (Modo Oscuro)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#16a34a",
                        secondary: "#facc15",
                        danger: "#dc2626",
                        "background-light": "#f0fdf4",
                        "background-dark": "#111827",
                        "text-light": "#1f2937",
                        "text-dark": "#e5e7eb",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1f2937",
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                },
            },
        };
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 flex items-center justify-between p-4 border-b border-green-200/5 dark:border-gray-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<button class="flex items-center justify-center w-10 h-10 text-danger">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-bold text-center flex-1">Crear tour</h1>
<div class="w-10"></div>
</header>
<main class="flex-1 px-4 py-6 space-y-6">
<div class="space-y-4">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Título
                    <input class="form-input mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary h-12 px-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Ej. Tour por la Bahía" type="text"/>
</label>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Descripción
                    <textarea class="form-textarea mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary min-h-[120px] p-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Describe los detalles del tour..."></textarea>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Precio
                        <input class="form-input mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary h-12 px-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="USD" type="number"/>
</label>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Duración
                        <input class="form-input mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary h-12 px-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Ej. 2 horas" type="text"/>
</label>
</div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Puntos de encuentro
                    <input class="form-input mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary h-12 px-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Ej. Muelle Principal" type="text"/>
</label>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Fotos del Tour</label>
<div class="flex flex-col items-center justify-center gap-4 rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-700 p-8 text-center bg-surface-dark">
<div class="flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 dark:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">photo_camera</span>
</div>
<p class="font-semibold text-text-dark">Añadir fotos</p>
<p class="text-sm text-gray-500 dark:text-gray-400">Sube imágenes para mostrar tu tour</p>
<button class="inline-flex items-center justify-center h-10 px-6 font-semibold tracking-wide text-white transition duration-200 rounded-lg bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">Subir</button>
</div>
</div>
<div>
<h2 class="text-xl font-bold text-text-dark">Disponibilidad</h2>
<p class="text-sm text-gray-500 dark:text-gray-400">Selecciona una fecha para añadir los cupos.</p>
<div class="mt-4 p-4 rounded-xl bg-surface-light dark:bg-surface-dark">
<div class="flex items-center justify-between mb-4">
<button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<p class="text-base font-bold text-text-dark">Julio 2024</p>
<button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 gap-1 text-center text-sm text-text-dark">
<div class="font-bold text-danger dark:text-red-400">D</div>
<div class="font-bold text-gray-500 dark:text-gray-400">L</div>
<div class="font-bold text-gray-500 dark:text-gray-400">M</div>
<div class="font-bold text-gray-500 dark:text-gray-400">M</div>
<div class="font-bold text-gray-500 dark:text-gray-400">J</div>
<div class="font-bold text-gray-500 dark:text-gray-400">V</div>
<div class="font-bold text-secondary dark:text-yellow-300">S</div>
<div class="col-start-2 h-10 flex items-center justify-center">1</div>
<div class="h-10 flex items-center justify-center">2</div>
<div class="h-10 flex items-center justify-center">3</div>
<div class="h-10 flex items-center justify-center">4</div>
<div class="h-10 flex items-center justify-center">5</div>
<div class="h-10 flex items-center justify-center text-secondary dark:text-yellow-300">6</div>
<div class="h-10 flex items-center justify-center text-danger dark:text-red-400">7</div>
<div class="h-10 flex items-center justify-center">8</div>
<div class="h-10 flex items-center justify-center">9</div>
<div class="h-10 flex items-center justify-center">10</div>
<div class="h-10 flex items-center justify-center">11</div>
<div class="h-10 flex items-center justify-center">12</div>
<div class="h-10 flex items-center justify-center text-secondary dark:text-yellow-300">13</div>
<div class="h-10 flex items-center justify-center text-danger dark:text-red-400">14</div>
<div class="h-10 flex items-center justify-center">15</div>
<div class="h-10 flex items-center justify-center">16</div>
<div class="h-10 flex items-center justify-center">17</div>
<div class="h-10 flex items-center justify-center">18</div>
<button class="h-10 flex items-center justify-center rounded-full bg-primary text-white">19</button>
<div class="h-10 flex items-center justify-center text-secondary dark:text-yellow-300">20</div>
<div class="h-10 flex items-center justify-center text-danger dark:text-red-400">21</div>
<div class="h-10 flex items-center justify-center">22</div>
<div class="h-10 flex items-center justify-center">23</div>
<div class="h-10 flex items-center justify-center">24</div>
<div class="h-10 flex items-center justify-center">25</div>
<div class="h-10 flex items-center justify-center">26</div>
<div class="h-10 flex items-center justify-center text-secondary dark:text-yellow-300">27</div>
<div class="h-10 flex items-center justify-center text-danger dark:text-red-400">28</div>
<div class="h-10 flex items-center justify-center">29</div>
<div class="h-10 flex items-center justify-center">30</div>
<div class="h-10 flex items-center justify-center">31</div>
</div>
</div>
<div class="mt-4">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300"> Cupos para el 19 de Julio
                        <input class="form-input mt-1 block w-full rounded-lg border-gray-700 bg-surface-dark dark:bg-surface-dark focus:ring-primary h-12 px-4 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Ej. 10" type="number"/>
</label>
</div>
</div>
</main>
<footer class="sticky bottom-0 px-4 py-3 bg-background-light dark:bg-background-dark border-t border-green-200/5 dark:border-gray-800">
<button class="w-full h-12 px-6 font-bold tracking-wide text-white transition duration-200 rounded-lg bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">Guardar Tour</button>
</footer>
</div>

</body></html>
