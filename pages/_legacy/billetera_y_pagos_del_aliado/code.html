<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Billetera y Pagos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#38e07b",
              "background-light": "#f6f8f7",
              "background-dark": "#122017",
            },
            fontFamily: {
              "display": ["Manrope"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center justify-between p-4">
<button class="flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined text-slate-800 dark:text-slate-200">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-center text-slate-900 dark:text-white">Billetera y Pagos</h1>
<div class="w-10"></div>
</div>
</header>
<main class="flex-grow px-4 py-6 space-y-8">
<section class="p-6 rounded-xl bg-background-light dark:bg-slate-800/50 shadow-md">
<div class="flex items-center justify-between mb-4">
<h2 class="text-sm font-medium text-slate-500 dark:text-slate-400">Saldo Actual</h2>
</div>
<div class="flex items-baseline justify-between">
<div>
<p class="text-4xl font-bold text-slate-900 dark:text-white">1,250</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Tokens $GUANA por Liquidar</p>
</div>
<p class="text-lg font-semibold text-primary">COP $125,000</p>
</div>
</section>
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-bold text-slate-900 dark:text-white">Historial de Pagos</h2>
<button class="flex items-center gap-2 text-sm font-semibold text-primary">
<span class="material-symbols-outlined text-base">download</span>
<span>Descargar Reporte</span>
</button>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between p-4 rounded-lg bg-background-light dark:bg-slate-800/50">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/20">
<span class="material-symbols-outlined text-primary">arrow_downward</span>
</div>
<div>
<p class="font-semibold text-slate-800 dark:text-slate-200">COP $50,000</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Liquidación #20231026</p>
</div>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">26 Oct 2023</p>
</div>
<div class="flex items-center justify-between p-4 rounded-lg bg-background-light dark:bg-slate-800/50">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/20">
<span class="material-symbols-outlined text-primary">arrow_downward</span>
</div>
<div>
<p class="font-semibold text-slate-800 dark:text-slate-200">COP $75,000</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Liquidación #20231015</p>
</div>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">15 Oct 2023</p>
</div>
<div class="flex items-center justify-between p-4 rounded-lg bg-background-light dark:bg-slate-800/50">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/20">
<span class="material-symbols-outlined text-primary">arrow_downward</span>
</div>
<div>
<p class="font-semibold text-slate-800 dark:text-slate-200">COP $100,000</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Liquidación #20230930</p>
</div>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">30 Sep 2023</p>
</div>
</div>
</section>
</main>
<footer class="sticky bottom-0 px-4 py-3 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<button class="w-full h-12 px-5 text-base font-bold text-center rounded-lg bg-primary text-slate-900">
<span>Solicitar Liquidación</span>
</button>
</footer>
</div>

</body></html>
